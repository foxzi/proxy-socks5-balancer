# Noisy upstreams: smooth latency and demand more confirmations before switching,
# to reduce flapping on unstable links.
check:
  interval: 10s
  timeout: 4s
  required: 2
  switch_margin: 0.4
  up_threshold: 2       # need 2 consecutive good cycles before trusting an upstream
  down_threshold: 3     # tolerate 2 blips, mark down on the 3rd consecutive failure
  latency_ewma: 0.3     # exponential smoothing of latency samples
  urls:
    - "https://www.google.com/generate_204"
    - "https://www.cloudflare.com/cdn-cgi/trace"
    - "https://api.github.com"
upstreams:
  - name: link-a
    socks5: "127.0.0.1:11080"
  - name: link-b
    socks5: "127.0.0.1:11081"
