# Minimal setup: two equal upstreams, always route through the fastest healthy one.
check:
  interval: 15s
  timeout: 5s
  required: 1
  urls:
    - "https://www.google.com/generate_204"
    - "https://www.cloudflare.com/cdn-cgi/trace"
upstreams:
  - name: xray-1
    socks5: "127.0.0.1:11080"
  - name: xray-2
    socks5: "127.0.0.1:11081"
